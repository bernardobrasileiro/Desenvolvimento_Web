<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculadora</title>
</head>

<body>
    <header>
        <h1>Calculadora de Média</h1>
    </header>
    <main>
        <div id="botoes">
            <button class="interacao">1</button>
            <button class="interacao">2</button>
            <button class="interacao">3</button>
            <button class="interacao">4</button>
            <button class="interacao">5</button>
            <button class="interacao">6</button>
            <button class="interacao">7</button>
            <button class="interacao">8</button>
            <button class="interacao">9</button>
            <button class="interacao" id="soma">+</button>
            <button class="interacao">0</button>
            <button class="interacao" id="igual">=</button>
        </div>
        <div>
            <h3>Resultado:</h3>
            <button id="resultado">0</button>
        </div>
    </main>
    <footer>
        <p>Contatos:</p>
        <ul>
            <li>LinkedIn: <a href="https://www.linkedin.com/in/bernardo-brasileiro-diniz-8174203b0/">LinkedIn</a></li>
            <li>GitHub: <a href="https://github.com/bernardobrasileiro">GitHub</a></li>
        </ul>
    </footer>
    <script src="script.js"></script>
</body>

</html>
