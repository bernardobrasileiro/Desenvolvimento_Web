<body>
    <h1>Questão 6</h1>
    <p>
        Solicite a temperatura ambiente e classifique-a utilizando if,
        else if e else: Fria, abaixo de 15 graus; Amena, de 15 a 25
        graus; e Quente, acima de 25 graus. Atenção à ordem das
        condições e aos valores exatos dos limites.
    </p>
    <script>
        let temperaturaAmbiente = 20;

        if (temperaturaAmbiente < 15) {
            console.log(`${temperaturaAmbiente} graus -> Fria`);
        }
        else if (temperaturaAmbiente <= 25) {
            console.log(`${temperaturaAmbiente} graus -> Amena`);
        }
        else {
            console.log(`${temperaturaAmbiente} graus -> Quente`);
        }
    </script>
</body>
