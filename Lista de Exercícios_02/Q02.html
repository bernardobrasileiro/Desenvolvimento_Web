<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q02</title>
</head>

<body>
    <h1>Questão 2</h1>
    <p>
        Declare uma variável pontos com valor inicial 0. Utilizando os
        operadores de atribuição, some 10, some mais 25, subtraia 5
        e, por fim, incremente 1. Exiba o valor da variável após cada
        alteração. Utilize +=, -= e ++ em vez de reescrever a
        operação completa.
    </p>
    <script>
        let valorInicial = 0;
        let inicio = valorInicial;

        console.log(`Inicio: ${inicio}`);

        inicio += 10;
        console.log(`Após += 10: ${inicio}`);

        inicio += 25;
        console.log(`Após += 25: ${inicio}`);

        inicio -= 5;
        console.log(`Após -= 5: ${inicio}`);

        inicio++;

        console.log(`Após ++: ${inicio}`);
    </script>
</body>

</html>
